<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uchacz - Snake</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: snow;
        }

        h1 {
            position: absolute;
            left: 0;
            top: 0;
            background-color: darkslategrey;
            color: snow;
            width: 100%;
            padding: 20px;
            text-align: left;
        }

        #refreshBtn {
            display: none;
            position: absolute;
            left: 50%;
            margin-left: -100px;
            top: 512px;
        }

        button {
            width: 200px;
            height: 50px;
            background-color: darkslategrey;
            border: 2px solid snow;
            color: snow;
            font-size: 20px;
            float: left;
        }

        button:hover {
            color: darkslategrey;
            background-color: snow;
            border: 2px solid #2f4f4f;
            float: left;
        }

        .sHead {
            /* Głowa domyślnie skierowana w prawo */
            width: 50px;
            height: 50px;
            background-image: url('https://rembound.com/files/creating-a-snake-game-tutorial-with-html5/snake-graphics.png');
            background-size: 250px;
            background-position: -200px 0px;
        }

        .sBody {
            /* Ciało domyślnie skierowane poziomo */
            width: 50px;
            height: 50px;
            background-image: url('https://rembound.com/files/creating-a-snake-game-tutorial-with-html5/snake-graphics.png');
            background-size: 250px;
            background-position: -50px 0px;
        }

        .sTail {
            /* Ogon domyślnie skierowany w prawo (ogon jest po lewej, końcówka w prawo) */
            width: 50px;
            height: 50px;
            background-image: url('https://rembound.com/files/creating-a-snake-game-tutorial-with-html5/snake-graphics.png');
            background-size: 250px;
            background-position: -200px -100px;
        }

        .sCurve {
            /* Zakręt domyślnie: z góry w prawo (lub z dołu w lewo) */
            width: 50px;
            height: 50px;
            background-image: url('https://rembound.com/files/creating-a-snake-game-tutorial-with-html5/snake-graphics.png');
            background-size: 250px;
            background-position: 0px -50px;
        }

        .apple {
            width: 50px;
            height: 50px;
            background-image: url('https://rembound.com/files/creating-a-snake-game-tutorial-with-html5/snake-graphics.png');
            background-size: 250px;
            background-position: 0px -150px;
        }

        .box {
            width: 50px;
            height: 50px;
            float: left;
        }

        #gameBoard {
            border: #2f4f4f 2px solid;
            width: 854px;
            position: absolute;
            top: 110px;
            left: 50%;
            margin-left: -427px;
        }

        .jeden {
            background-color: #2f4f4f;
        }

        .dwa:nth-child(2n) {
            background-color: rgb(221, 237, 221);
        }

        .dwa:nth-child(2n-1) {
            background-color: #ffffff;
        }

        .snake {
            width: 50px;
            height: 50px;
        }
    </style>
    <script>
        // Funkcja zapobiegająca scrollowanie strzałkami
        function preventArrowScroll(event) {
            if (event.keyCode === 38 || event.keyCode === 40) {
                event.preventDefault();
            }
        }

        document.addEventListener('keydown', preventArrowScroll);

        // Reset gry
        function refreshPage() {
            snake.direction = 'right';
            snake.body = [
                { x: 6, y: 8 },
                { x: 5, y: 8 },
                { x: 4, y: 8 }
            ];
            gameStarted = false;
            clearInterval(snakeLoop);
            document.getElementById('refreshBtn').style.display = 'none';

            const gameBoard = document.getElementById('gameBoard');
            game.render(gameBoard);

            const oldApple = document.querySelector('.apple');
            if (oldApple) {
                oldApple.parentNode.removeChild(oldApple);
            }
            const appleDiv = document.createElement('div');
            appleDiv.classList.add('apple');
            appleDiv.setAttribute('data-x', 10);
            appleDiv.setAttribute('data-y', 8);
            const appleBox = document.querySelector(`.box[data-x="10"][data-y="8"]`);
            appleBox.appendChild(appleDiv);
        }

        let gameStarted = false;

        // Kierunek między segmentami
        function directionBetween(from, to) {
            if (to.x > from.x) return 'right';
            if (to.x < from.x) return 'left';
            if (to.y > from.y) return 'down';
            if (to.y < from.y) return 'up';
            return null;
        }

        // Obrót segmentu  
        function getSegmentStyle(index) {
            const body = snake.body;
            const seg = body[index];

            // Głowa
            if (index === 0) {
                return { cls: 'sHead', rot: dirToAngle(snake.direction) };
            }

            // Ogon - kierunek od ogona do przedostatniego segmentu
            if (index === body.length - 1) {
                const prev = body[index - 1];
                const dir = directionBetween(seg, prev);
                return { cls: 'sTail', rot: dirToAngle(dir) };
            }

            // Segment środkowy (ciało lub zakręt)
            const prev = body[index - 1];
            const next = body[index + 1];

            const dirFromPrev = directionBetween(seg, prev); // skąd idzie głowa
            const dirToNext = directionBetween(seg, next);  // dokąd idzie ogon

            // Prosta linia czy zakręt
            if (isOpposite(dirFromPrev, dirToNext)) {
                const rot = (dirFromPrev === 'left' || dirFromPrev === 'right') ? 0 : 90;
                return { cls: 'sBody', rot };
            } else {
                const rot = curveAngle(dirFromPrev, dirToNext);
                return { cls: 'sCurve', rot };
            }
        }

        // Kierunek ruchu na kąt obrotu w stopniach
        function dirToAngle(dir) {
            switch (dir) {
                case 'right': return 0;
                case 'down': return 90;
                case 'left': return 180;
                case 'up': return 270;
            }
            return 0;
        }

        // Czy prosta linia
        function isOpposite(a, b) {
            return (a === 'left' && b === 'right') ||
                (a === 'right' && b === 'left') ||
                (a === 'up' && b === 'down') ||
                (a === 'down' && b === 'up');
        }

        // Obsługa zakrętów
        function curveAngle(a, b) {
            const pair = new Set([a, b]);
            const has = (x, y) => pair.has(x) && pair.has(y);

            if (has('up', 'right')) return 0;
            if (has('right', 'down')) return 90;
            if (has('down', 'left')) return 180;
            if (has('left', 'up')) return 270;

            return 0;
        }

        let snake = {
            direction: 'right',
            body: [
                { x: 6, y: 8 },
                { x: 5, y: 8 },
                { x: 4, y: 8 }
            ],

            renderSnake() {
                // Czyszczenie starego węża
                document.querySelectorAll('.snake').forEach(box => {
                    box.classList.remove('snake', 'sHead', 'sBody', 'sTail', 'sCurve');
                    box.style.transform = '';
                });

                this.body.forEach((segment, index) => {
                    const box = document.querySelector(`.box[data-x="${segment.x}"][data-y="${segment.y}"]`);
                    if (!box) return;

                    const { cls, rot } = getSegmentStyle(index);
                    box.classList.add('snake', cls);
                    box.style.transform = `rotate(${rot}deg)`;
                });
            },

            move() {
                let newHead = { ...this.body[0] };

                switch (this.direction) {
                    case 'up': newHead.y -= 1; break;
                    case 'down': newHead.y += 1; break;
                    case 'left': newHead.x -= 1; break;
                    case 'right': newHead.x += 1; break;
                }

                if (game.checkCollision(newHead) || this.checkSelfCollision(newHead)) {
                    clearInterval(snakeLoop);
                    document.getElementById('refreshBtn').style.display = 'block';
                    return;
                }

                // Sprawdzenie czy nowa głowa trafi na jabłko
                const apple = document.querySelector(`.apple[data-x="${newHead.x}"][data-y="${newHead.y}"]`);
                if (apple) {
                    apple.classList.remove('apple');
                    this.body.unshift(newHead);
                    game.placeApple();
                } else {
                    this.body.unshift(newHead);
                    this.body.pop();
                }
            },

            checkSelfCollision(newHead) {
                return this.body.slice(1).some(s => s.x === newHead.x && s.y === newHead.y);
            },

            changeDirection(newDirection) {
                if (
                    (this.direction === 'up' && newDirection === 'down') ||
                    (this.direction === 'down' && newDirection === 'up') ||
                    (this.direction === 'left' && newDirection === 'right') ||
                    (this.direction === 'right' && newDirection === 'left')
                ) return;
                this.direction = newDirection;
            },
        };

        function kd(event) {
            if (!gameStarted && event.key.startsWith('Arrow')) {
                gameStarted = true;
                snakeLoop = setInterval(() => {
                    snake.move();
                    snake.renderSnake();
                }, 140);
            }

            switch (event.key) {
                case 'ArrowUp': snake.changeDirection('up'); break;
                case 'ArrowDown': snake.changeDirection('down'); break;
                case 'ArrowLeft': snake.changeDirection('left'); break;
                case 'ArrowRight': snake.changeDirection('right'); break;
            }
        }

        let game = {
            width: 17,
            height: 17,

            render(gameBoard) {
                gameBoard.innerHTML = '';
                for (let i = 0; i < this.height; i++) {
                    for (let j = 0; j < this.width; j++) {
                        const div = document.createElement("div");
                        div.classList.add("box");
                        div.classList.add(i === 0 || j === 0 || j === this.width - 1 || i === this.height - 1 ? 'jeden' : 'dwa');
                        div.setAttribute('data-x', j);
                        div.setAttribute('data-y', i);
                        gameBoard.append(div);
                    }
                }
                snake.renderSnake();
            },

            checkCollision(newHead) {
                return (
                    newHead.x === 0 ||
                    newHead.x === this.width - 1 ||
                    newHead.y === 0 ||
                    newHead.y === this.height - 1
                );
            },

            placeApple() {
                let appleX, appleY;
                do {
                    appleX = Math.floor(Math.random() * (this.width - 2)) + 1;
                    appleY = Math.floor(Math.random() * (this.height - 2)) + 1;
                } while (snake.body.some(s => s.x === appleX && s.y === appleY));

                const div = document.createElement("div");
                div.classList.add("apple");
                div.setAttribute('data-x', appleX);
                div.setAttribute('data-y', appleY);
                const applePos = document.querySelector(`.box[data-x="${appleX}"][data-y="${appleY}"]`);
                applePos.appendChild(div);
            }
        };

        function PlayField() {
            const gameBoard = document.getElementById("gameBoard");
            game.render(gameBoard);

            const appleDiv = document.createElement("div");
            appleDiv.classList.add("apple");
            appleDiv.setAttribute('data-x', 10);
            appleDiv.setAttribute('data-y', 8);
            const applePos = document.querySelector(`.box[data-x="10"][data-y="8"]`);
            applePos.appendChild(appleDiv);
        }
    </script>
</head>

<body onload="PlayField()" onkeydown="kd(event)">
    <h1>Snake</h1>
    <div id="gameBoard"></div>
    <button id="refreshBtn" onclick="refreshPage()">Restart</button>
</body>

</html>
